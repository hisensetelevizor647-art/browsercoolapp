name: Build Watch APK

on:
  push:
    branches:
      - main
      - ai-watch-update
  pull_request:
    branches:
      - main
      - ai-watch-update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unified Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/ai-watch-v1.0.${{ github.run_number }}-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-apk-v1.0.${{ github.run_number }}
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
